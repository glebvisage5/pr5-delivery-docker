server:
  port: 8080
  shutdown: graceful   # при docker stop завершить начатые запросы
  error:
    include-message: always   # текст причины ошибки в ответе

spring:
  application:
    name: delivery-service
  jackson:
    serialization:
      indent-output: true
    default-property-inclusion: non_null

app:
  instance-id: ${INSTANCE_ID:${HOSTNAME:local}}
  order-service:
    # адрес Order Service задаётся переменной окружения (compose.yaml)
    url: ${ORDER_SERVICE_URL}
    timeout: ${ORDER_SERVICE_TIMEOUT:2s}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [${app.instance-id}] %logger{0} : %msg%n"
