name: pr5

services:

  # ---------- единая внешняя точка входа ----------
  traefik:
    image: traefik:v3.6
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false     # маршрутизируются только сервисы с traefik.enable=true
      - --providers.docker.network=pr5_backend
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      - --api.insecure=true                           # панель Traefik на порту 8080 контейнера
      - --ping=true
      - --accesslog=true
      - --accesslog.format=common
      - --serversTransport.forwardingTimeouts.dialTimeout=1s   # быстро считать недоступный экземпляр ошибкой
    ports:
      - "${HTTP_PORT}:80"
      - "${TRAEFIK_DASHBOARD_PORT}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      order-service:
        condition: service_healthy
      delivery-service:
        condition: service_healthy
    networks: [backend]

  # ---------- база данных Order Service ----------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  # ---------- Order Service: заказы, PostgreSQL ----------
  order-service:
    build: ./order-service
    image: pr5/order-service:1.0
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 3s
      start_period: 40s
      retries: 10
    labels:
      - traefik.enable=true
      - traefik.http.routers.orders.rule=PathPrefix(`/api/orders`)
      - traefik.http.routers.orders.entrypoints=web
      - traefik.http.routers.orders.middlewares=retry@docker
      # повтор запроса на другом экземпляре при сетевой ошибке
      - traefik.http.middlewares.retry.retry.attempts=3
      - traefik.http.middlewares.retry.retry.initialinterval=100ms
      - traefik.http.services.orders.loadbalancer.server.port=8080
      - traefik.http.services.orders.loadbalancer.healthcheck.path=/actuator/health
      - traefik.http.services.orders.loadbalancer.healthcheck.interval=5s
    networks: [backend]

  # ---------- Delivery Service: несколько экземпляров за Traefik ----------
  delivery-service:
    build: ./delivery-service
    image: pr5/delivery-service:1.0
    environment:
      ORDER_SERVICE_URL: http://order-service:8080
      ORDER_SERVICE_TIMEOUT: 2s
    deploy:
      replicas: ${DELIVERY_REPLICAS}
    depends_on:
      order-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 3s
      start_period: 40s
      retries: 10
    labels:
      - traefik.enable=true
      - traefik.http.routers.deliveries.rule=PathPrefix(`/api/deliveries`)
      - traefik.http.routers.deliveries.entrypoints=web
      - traefik.http.routers.deliveries.middlewares=retry@docker
      # повтор запроса на другом экземпляре при сетевой ошибке
      - traefik.http.middlewares.retry.retry.attempts=3
      - traefik.http.middlewares.retry.retry.initialinterval=100ms
      - traefik.http.services.deliveries.loadbalancer.server.port=8080
      - traefik.http.services.deliveries.loadbalancer.healthcheck.path=/actuator/health
      - traefik.http.services.deliveries.loadbalancer.healthcheck.interval=5s
    networks: [backend]

networks:
  backend:

volumes:
  pgdata:
